{% extends "frontend/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h1>{{ page_title }}</h1>
        </div>
        <div class="col-auto">
            <a href="{% url 'content:notification_list' %}" class="btn btn-outline-secondary">Back to Notifications</a>
        </div>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}

    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="email_enabled" name="email_enabled" {% if preferences.email_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="email_enabled">
                        Enable email notifications
                    </label>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="in_app_enabled" name="in_app_enabled" {% if preferences.in_app_enabled %}checked{% endif %}>
                    <label class="form-check-label" for="in_app_enabled">
                        Enable in-app notifications
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Save Preferences</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
