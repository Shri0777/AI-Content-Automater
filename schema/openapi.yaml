      required:
      - account_name
      - demo_mode
      - error
      - external_id
      - id
      - platform
      - published_at
      - resolved_by
      - status
    PublicationStatusEnum:
      enum:
      - publishing
      - published
      - failed
      - ambiguous
      type: string
      description: |-
        * `publishing` - Publishing
        * `published` - Published
        * `failed` - Failed
        * `ambiguous` - Not confirmed
    Recover:
      type: object
