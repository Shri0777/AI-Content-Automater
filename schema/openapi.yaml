      - generate_at
      - id
      - post
      - publish_at
      - status
    PostSlotStatusEnum:
      enum:
      - waiting
      - claimed
      - started
      - skipped
      type: string
      description: |-
        * `waiting` - Waiting for its time
        * `claimed` - Being started by a worker
        * `started` - Post started
        * `skipped` - Skipped
    PostStatusEnum:
      enum:
      - researching
      - drafting
      - imaging
      - reviewing
      - correcting
      - awaiting_approval
      - approved
      - publishing
      - published
      - rejected
      - expired
      - skipped
      - failed
      type: string
      description: |-
        * `researching` - Finding an article
        * `drafting` - Writing the caption
        * `imaging` - Making the poster
        * `reviewing` - Checking the post
        * `correcting` - Fixing what the review found
        * `awaiting_approval` - Waiting for your approval
        * `approved` - Approved
        * `publishing` - Publishing
        * `published` - Published
        * `rejected` - Rejected
        * `expired` - Expired before it was approved
        * `skipped` - Skipped
        * `failed` - Failed
    PostVersion:
      type: object
