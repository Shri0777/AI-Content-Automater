          readOnly: true
        succeeded:
          type: boolean
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
        error:
          type: string
          readOnly: true
        providers:
          type: string
          readOnly: true
        prompt_versions:
          type: string
          readOnly: true
        input_tokens:
          type: integer
          readOnly: true
        output_tokens:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - duration_ms
      - error
      - input_tokens
      - output_tokens
      - prompt_versions
      - providers
      - stage
      - succeeded
    Health:
      type: object
      description: The answer from the health check endpoint.
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LimitUsage:
      type: object
