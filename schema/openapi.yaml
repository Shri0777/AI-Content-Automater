      - key_hint
      - kind
      - last_checked_at
      - last_error
      - status
      - updated_at
    CredentialKindEnum:
      enum:
      - text
      - image
      - news
      type: string
      description: |-
        * `text` - Text model
        * `image` - Image model
        * `news` - News source
    CredentialStatusEnum:
      enum:
      - unverified
      - verified
      - invalid
      type: string
      description: |-
        * `unverified` - Not checked yet
        * `verified` - Working
        * `invalid` - The provider refused the key
    GenerationStep:
      type: object
      description: One stage run of the pipeline.
      properties:
        stage:
