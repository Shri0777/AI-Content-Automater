      - demo_mode
      - id
      - plan
      - plan_name
      - poster_url
      - publications
      - scheduled_for
      - status
      - status_reason
      - steps
      - updated_at
      - versions
    PostSlot:
      type: object
      description: 'One coming slot: when it posts, and its post once started.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publish_at:
          type: string
          format: date-time
          readOnly: true
        generate_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PostSlotStatusEnum'
          readOnly: true
