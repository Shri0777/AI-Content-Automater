      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
        tier:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - tier
      - timezone
    VerdictEnum:
      enum:
      - pass
      - revise
      - reject
      type: string
      description: |-
        * `pass` - Pass
        * `revise` - Needs changes
        * `reject` - Reject
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
