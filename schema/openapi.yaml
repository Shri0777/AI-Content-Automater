      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - recovery_codes
    Register:
      type: object
      description: The fields needed to create an account.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        invite_code:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RegisterResult:
      type: object
      description: 'What registration sends back: the new user plus recovery codes.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
        tier:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - date_joined
      - email
      - id
      - recovery_codes
      - tier
      - timezone
    Resolve:
      type: object
      description: The owner's answer about a post we could not confirm.
      properties:
        outcome:
