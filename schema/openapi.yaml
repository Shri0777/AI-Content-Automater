      properties:
        resource:
          type: string
        description:
          type: string
        period:
          type: string
        applies_to:
          type: string
        limit:
          type: integer
        used:
          type: integer
          nullable: true
        resets_at:
          type: string
          format: date-time
          nullable: true
      required:
      - applies_to
      - description
      - limit
      - period
      - resets_at
      - resource
      - used
    LinkMethodEnum:
      enum:
      - oauth
      - api_key
      - demo
      type: string
      description: |-
        * `oauth` - oauth
        * `api_key` - api_key
        * `demo` - demo
    LinkStart:
      type: object
      description: Where to send the user to approve the link.
      properties:
        authorization_url:
          type: string
          format: uri
      required:
      - authorization_url
    Login:
      type: object
      description: The fields needed to log in.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResult:
      type: object
      description: What a successful login or refresh sends back.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
    MarkedRead:
      type: object
      description: How many notifications were just marked as read.
      properties:
        marked_read:
          type: integer
      required:
      - marked_read
    Notification:
      type: object
      description: One notification as the frontend sees it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/NotificationKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        related_type:
          type: string
          readOnly: true
        related_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - kind
      - message
      - read_at
      - related_id
      - related_type
      - title
    NotificationKindEnum:
      enum:
      - post_awaiting_approval
      - post_published
      - publish_unconfirmed
      - post_failed
      - post_skipped
      - post_expired
      - account_needs_reauth
      - credential_invalid
      - quota_reached
      - plan_paused
      - outage_missed_slots
      type: string
      description: |-
        * `post_awaiting_approval` - A post is waiting for your approval
        * `post_published` - Post published
        * `publish_unconfirmed` - Check whether a post went out
        * `post_failed` - A post could not be made
        * `post_skipped` - A post was skipped
        * `post_expired` - A post expired before it was approved
        * `account_needs_reauth` - Reconnect a social account
        * `credential_invalid` - An API key stopped working
        * `quota_reached` - You reached a free-tier limit
        * `plan_paused` - A content plan was paused
        * `outage_missed_slots` - Some scheduled posts were missed
    OnMissedApprovalEnum:
      enum:
      - expire
      - hold
      type: string
      description: |-
        * `expire` - Drop it (old news loses its value)
        * `hold` - Keep it; publish as soon as I approve
    OutcomeEnum:
      enum:
      - published
      - not_published
      type: string
      description: |-
        * `published` - published
        * `not_published` - not_published
    PatchedMeUpdate:
      type: object
      description: The details users may change about themselves.
      properties:
        timezone:
          type: string
          maxLength: 64
    PatchedPostEdit:
      type: object
      description: The user's own wording for a post waiting for approval.
      properties:
        headline:
          type: string
          default: ''
          maxLength: 90
        caption:
          type: string
          maxLength: 3000
    Plan:
      type: object
      description: A plan as the API shows it, with its topics, accounts and schedule.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        requirements:
          type: string
          readOnly: true
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          readOnly: true
        ai_label_enabled:
          type: boolean
          readOnly: true
        ai_label_text:
          type: string
          readOnly: true
        paused:
          type: boolean
          readOnly: true
        lead_time_minutes:
          type: integer
          readOnly: true
        max_lateness_minutes:
          type: integer
          readOnly: true
        on_missed_approval:
          allOf:
          - $ref: '#/components/schemas/OnMissedApprovalEnum'
          readOnly: true
        auto_post_min_score:
          type: integer
          readOnly: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
          readOnly: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SocialAccount'
          readOnly: true
        schedule_rules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRule'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accounts
      - ai_label_enabled
      - ai_label_text
      - approval_mode
      - auto_post_min_score
      - created_at
      - id
      - lead_time_minutes
      - max_lateness_minutes
      - name
      - on_missed_approval
      - paused
      - requirements
      - schedule_rules
      - topics
    PlanCreate:
      type: object
      description: The details needed to create a plan.
      properties:
        name:
          type: string
          maxLength: 100
        requirements:
          type: string
          default: ''
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          default: manual
        ai_label_enabled:
          type: boolean
          default: true
        ai_label_text:
          type: string
          default: Made with AI assistance.
          maxLength: 100
        lead_time_minutes:
          type: integer
          maximum: 1440
          minimum: 15
          default: 60
        max_lateness_minutes:
          type: integer
          maximum: 240
          minimum: 5
          default: 30
        on_missed_approval:
          allOf:
          - $ref: '#/components/schemas/OnMissedApprovalEnum'
          default: expire
        auto_post_min_score:
          type: integer
          maximum: 25
          minimum: 15
          default: 22
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        account_ids:
          type: array
          items:
            type: string
            format: uuid
        schedule_rules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRule'
      required:
      - account_ids
      - name
      - topics
    Platform:
      type: object
      description: One platform and whether accounts can be linked on it right now.
      properties:
        platform:
          type: string
        name:
          type: string
        link_method:
          $ref: '#/components/schemas/LinkMethodEnum'
        ready:
          type: boolean
      required:
      - link_method
      - name
      - platform
      - ready
    PlatformEnum:
      enum:
      - demo
      - buffer
      - x
      - linkedin
      - facebook
      type: string
      description: |-
        * `demo` - Demo network
        * `buffer` - Buffer
        * `x` - X
        * `linkedin` - LinkedIn
        * `facebook` - Facebook Page
    Post:
      type: object
      description: 'A post in a list: its status and where it belongs.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: string
          format: uuid
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        topic_name:
          type: string
        scheduled_for:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PostStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - demo_mode
      - id
      - plan
      - plan_name
      - scheduled_for
      - status
      - status_reason
      - updated_at
    PostDetail:
      type: object
      description: One post with everything made for it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: string
          format: uuid
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        topic_name:
          type: string
        scheduled_for:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PostStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        article:
          allOf:
          - $ref: '#/components/schemas/ArticleSummary'
          readOnly: true
        poster_url:
          type: string
          nullable: true
