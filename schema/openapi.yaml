        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        network:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SocialAccountStatusEnum'
          readOnly: true
        last_error:
          type: string
          readOnly: true
        link_expires_at:
          type: string
          format: date-time
