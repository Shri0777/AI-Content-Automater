openapi: 3.0.3
info:
  title: AI Content Automator API
  version: 1.0.0
  description: Finds news, makes posters with AI, reviews them and posts them.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Return an access token and set the refresh cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Cancel the refresh token (if any) and delete the cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/recover/:
    post:
      operationId: auth_recover_create
      description: Use one recovery code to set a new password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Recover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Recover'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResult'
          description: ''
  /api/v1/auth/recovery-codes/:
    post:
      operationId: auth_recovery_codes_create
      description: Check the password, then replace the codes and show the new ones
        once.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Return a new access token and replace the refresh cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create the user; return their details and recovery codes (shown
        once).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
          description: ''
  /api/v1/credentials/:
    get:
      operationId: credentials_list
      description: Return the user's credentials (never the keys themselves).
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
          description: ''
    post:
      operationId: credentials_create
      description: Save a credential; an existing one of the same kind is replaced.
      tags:
      - credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Credential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Credential'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
  /api/v1/credentials/{credential_id}/:
    delete:
      operationId: credentials_destroy
      description: Delete the credential if it belongs to the user.
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/credentials/{credential_id}/test/:
    post:
      operationId: credentials_test_create
      description: Run the check and return the credential with its new status.
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Return "ok" when the database answers, otherwise a 503 error.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Show the logged-in user's details.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      description: Change the details users may change (currently their timezone).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/me/summary/:
    get:
      operationId: me_summary_retrieve
      description: Return the counts the frontend shows as badges.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          description: ''
  /api/v1/me/usage/:
    get:
      operationId: me_usage_retrieve
      description: Return the logged-in user's limits and usage.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: ''
  /api/v1/news/preview/:
    get:
      operationId: news_preview_list
      description: Return up to five articles a post on this topic could use.
      parameters:
      - in: query
        name: preset
        schema:
          type: string
        required: true
      tags:
      - news
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticlePreview'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: Return one page of notifications; add ?unread=true for unread only.
      parameters:
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{notification_id}/read/:
    post:
      operationId: notifications_read_create
      description: Mark the notification as read and return it.
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      description: Mark everything read and say how many changed.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkedRead'
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: Return the number of unread notifications.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/v1/plans/:
    get:
      operationId: plans_list
      description: Return the user's plans.
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
    post:
      operationId: plans_create
      description: Create a plan with its topics and target accounts.
      tags:
      - plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/plans/{plan_id}/:
    get:
      operationId: plans_retrieve
      description: Return one of the user's plans.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
    delete:
      operationId: plans_destroy
      description: Delete the plan and every post made for it.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/plans/{plan_id}/generate-now/:
    post:
      operationId: plans_generate_now_create
      description: Start making a post. Poll the post until it waits for approval.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/plans/{plan_id}/pause/:
    post:
      operationId: plans_pause_create
      description: Pause the plan and remove its waiting slots.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/plans/{plan_id}/resume/:
    post:
      operationId: plans_resume_create
      description: Resume the plan and make its coming slots.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/plans/{plan_id}/schedule/:
    put:
      operationId: plans_schedule_update
      description: Save new rules and remake the slots that have not started yet.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Schedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Schedule'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/plans/{plan_id}/upcoming/:
    get:
      operationId: plans_upcoming_list
      description: Return the slots from now on, soonest first.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSlot'
          description: ''
  /api/v1/posts/:
    get:
      operationId: posts_list
      description: Return one page of posts; add ?status=... to filter.
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
          description: ''
  /api/v1/posts/{post_id}/:
    get:
      operationId: posts_retrieve
      description: Return everything about one post.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
    patch:
      operationId: posts_partial_update
      description: Change the headline or caption of a post waiting for approval.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPostEdit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPostEdit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPostEdit'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/posts/{post_id}/approve/:
    post:
      operationId: posts_approve_create
      description: Approve the post and start publishing it.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/posts/{post_id}/poster/:
    get:
      operationId: posts_poster_retrieve
      description: Return the newest poster as a PNG image.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/posts/{post_id}/reject/:
    post:
      operationId: posts_reject_create
      description: Reject the post.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/public/posters/{token}.png:
    get:
      operationId: public_posters_.png_retrieve
      description: Return the poster as a PNG image if the link is valid.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/publications/{publication_id}/resolve/:
    post:
      operationId: publications_resolve_create
      description: Record the owner's answer and update the post.
      parameters:
      - in: path
        name: publication_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - publications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolve'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Resolve'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Resolve'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
          description: ''
  /api/v1/social/accounts/:
    get:
      operationId: social_accounts_list
      description: Return every account the user has linked.
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/v1/social/accounts/{account_id}/:
    delete:
      operationId: social_accounts_destroy
      description: Cancel the account's tokens and remove it, if it is the user's.
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/social/link/{platform}/callback/:
    get:
      operationId: social_link_callback_retrieve
      description: Finish linking and send the user on to the frontend's result page.
      parameters:
      - in: path
        name: platform
        schema:
          type: string
        required: true
      tags:
      - social
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/social/link/{platform}/start/:
    post:
      operationId: social_link_start_create
      description: Return the platform page where the user approves the link.
      parameters:
      - in: path
        name: platform
        schema:
          type: string
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStart'
          description: ''
  /api/v1/social/link/buffer/:
    post:
      operationId: social_link_buffer_create
      description: Find the key's channels and link them (or only the chosen ones).
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BufferLink'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BufferLink'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BufferLink'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/v1/social/link/demo/:
    post:
      operationId: social_link_demo_create
      description: Create a demo account straight away; there is no login page.
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/v1/social/platforms/:
    get:
      operationId: social_platforms_list
      description: Return every platform with how it is linked and if it is ready.
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
          description: ''
components:
  schemas:
    ApprovalModeEnum:
      enum:
      - manual
      - auto
      type: string
      description: |-
        * `manual` - I approve every post
        * `auto` - Post automatically when the review is clean
    ArticlePreview:
      type: object
      description: An article in a topic preview, with where its text came from.
      properties:
        title:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        source_name:
          type: string
          readOnly: true
        source_tier:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
        text_source:
          type: string
          readOnly: true
      required:
      - published_at
      - source_name
      - source_tier
      - text_source
      - title
      - url
    ArticleSummary:
      type: object
      description: 'The article a post is based on: enough to credit and check it.'
      properties:
        title:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        source_name:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - published_at
      - source_name
      - title
      - url
    BlankEnum:
      enum:
      - ''
    BufferLink:
      type: object
      description: The Buffer API key, and optionally which channels to link.
      properties:
        api_key:
          type: string
          writeOnly: true
          maxLength: 500
        channel_ids:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 50
      required:
      - api_key
    ConfirmPassword:
      type: object
      description: The user's current password, asked for again before a risky change.
      properties:
        password:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - password
    Credential:
      type: object
      description: A saved credential. The API key is accepted but never sent back.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/CredentialKindEnum'
        adapter:
          type: string
          maxLength: 40
        model_name:
          type: string
          maxLength: 200
        base_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        api_key:
          type: string
          writeOnly: true
        key_hint:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CredentialStatusEnum'
          readOnly: true
        last_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
