          type: string
          default: ''
          maxLength: 200
      required:
      - outcome
    ResolvedByEnum:
      enum:
      - platform
      - user
      type: string
      description: |-
        * `` - Not settled
        * `platform` - Checked with the platform
        * `user` - Confirmed by the user
    Review:
