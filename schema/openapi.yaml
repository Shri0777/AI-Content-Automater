          format: uuid
          readOnly: true
        account_name:
          type: string
          readOnly: true
        platform:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PublicationStatusEnum'
          readOnly: true
        external_id:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_by:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ResolvedByEnum'
