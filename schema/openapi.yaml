openapi: 3.0.3
info:
  title: AI Content Automator API
  version: 1.0.0
  description: Finds news, makes posters with AI, reviews them and posts them.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Return an access token and set the refresh cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Cancel the refresh token (if any) and delete the cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/recover/:
    post:
      operationId: auth_recover_create
      description: Use one recovery code to set a new password.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Recover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Recover'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverResult'
          description: ''
  /api/v1/auth/recovery-codes/:
    post:
      operationId: auth_recovery_codes_create
      description: Replace the user's recovery codes and show the new ones once.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Return a new access token and replace the refresh cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create the user; return their details and recovery codes (shown
        once).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
          description: ''
  /api/v1/credentials/:
    get:
      operationId: credentials_list
      description: Return the user's credentials (never the keys themselves).
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
          description: ''
    post:
      operationId: credentials_create
      description: Save a credential; an existing one of the same kind is replaced.
      tags:
      - credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Credential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Credential'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
  /api/v1/credentials/{credential_id}/:
    delete:
      operationId: credentials_destroy
      description: Delete the credential if it belongs to the user.
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/credentials/{credential_id}/test/:
    post:
      operationId: credentials_test_create
      description: Run the check and return the credential with its new status.
      parameters:
      - in: path
        name: credential_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - credentials
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Return "ok" when the database answers, otherwise a 503 error.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Show the logged-in user's details.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      description: Change the details users may change (currently their timezone).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/me/summary/:
    get:
      operationId: me_summary_retrieve
      description: Return the counts the frontend shows as badges.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          description: ''
  /api/v1/me/usage/:
    get:
      operationId: me_usage_retrieve
      description: Return the logged-in user's limits and usage.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: Return one page of notifications; add ?unread=true for unread only.
      parameters:
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{notification_id}/read/:
    post:
      operationId: notifications_read_create
      description: Mark the notification as read and return it.
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: notifications_read_all_create
      description: Mark everything read and say how many changed.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkedRead'
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: Return the number of unread notifications.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/v1/plans/:
    get:
      operationId: plans_list
      description: Return the user's plans.
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
          description: ''
    post:
      operationId: plans_create
      description: Create a plan with its topics and target accounts.
      tags:
      - plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
  /api/v1/plans/{plan_id}/:
    get:
      operationId: plans_retrieve
      description: Return one of the user's plans.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
    delete:
      operationId: plans_destroy
      description: Delete the plan and every post made for it.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/plans/{plan_id}/generate-now/:
    post:
      operationId: plans_generate_now_create
      description: Start making a post. Poll the post until it waits for approval.
      parameters:
      - in: path
        name: plan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - plans
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/posts/:
    get:
      operationId: posts_list
      description: Return one page of posts; add ?status=... to filter.
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
          description: ''
  /api/v1/posts/{post_id}/:
    get:
      operationId: posts_retrieve
      description: Return everything about one post.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/posts/{post_id}/approve/:
    post:
      operationId: posts_approve_create
      description: Approve the post and start publishing it.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/posts/{post_id}/poster/:
    get:
      operationId: posts_poster_retrieve
      description: Return the newest poster as a PNG image.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/posts/{post_id}/reject/:
    post:
      operationId: posts_reject_create
      description: Reject the post.
      parameters:
      - in: path
        name: post_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - posts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/social/accounts/:
    get:
      operationId: social_accounts_list
      description: Return every account the user has linked.
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialAccount'
          description: ''
  /api/v1/social/accounts/{account_id}/:
    delete:
      operationId: social_accounts_destroy
      description: Remove the account if it belongs to the user.
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/social/link/demo/:
    post:
      operationId: social_link_demo_create
      description: Create a demo account straight away; there is no login page.
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccount'
          description: ''
components:
  schemas:
    ApprovalModeEnum:
      enum:
      - manual
      type: string
      description: '* `manual` - I approve every post'
    ArticleSummary:
      type: object
      description: 'The article a post is based on: enough to credit and check it.'
      properties:
        title:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        source_name:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - published_at
      - source_name
      - title
      - url
    Credential:
      type: object
      description: A saved credential. The API key is accepted but never sent back.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/CredentialKindEnum'
        adapter:
          type: string
          maxLength: 40
        model_name:
          type: string
          maxLength: 200
        base_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        api_key:
          type: string
          writeOnly: true
        key_hint:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CredentialStatusEnum'
          readOnly: true
        last_checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - adapter
      - id
      - key_hint
      - kind
      - last_checked_at
      - last_error
      - status
      - updated_at
    CredentialKindEnum:
      enum:
      - text
      - image
      - news
      type: string
      description: |-
        * `text` - Text model
        * `image` - Image model
        * `news` - News source
    CredentialStatusEnum:
      enum:
      - unverified
      - verified
      - invalid
      type: string
      description: |-
        * `unverified` - Not checked yet
        * `verified` - Working
        * `invalid` - The provider refused the key
    GenerationStep:
      type: object
      description: One stage run of the pipeline.
      properties:
        stage:
          type: string
          readOnly: true
        succeeded:
          type: boolean
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
        error:
          type: string
          readOnly: true
        providers:
          type: string
          readOnly: true
        prompt_versions:
          type: string
          readOnly: true
        input_tokens:
          type: integer
          readOnly: true
        output_tokens:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - duration_ms
      - error
      - input_tokens
      - output_tokens
      - prompt_versions
      - providers
      - stage
      - succeeded
    Health:
      type: object
      description: The answer from the health check endpoint.
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LimitUsage:
      type: object
      description: One limit and how much of it is used.
      properties:
        resource:
          type: string
        description:
          type: string
        period:
          type: string
        applies_to:
          type: string
        limit:
          type: integer
        used:
          type: integer
          nullable: true
        resets_at:
          type: string
          format: date-time
          nullable: true
      required:
      - applies_to
      - description
      - limit
      - period
      - resets_at
      - resource
      - used
    Login:
      type: object
      description: The fields needed to log in.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResult:
      type: object
      description: What a successful login or refresh sends back.
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
    MarkedRead:
      type: object
      description: How many notifications were just marked as read.
      properties:
        marked_read:
          type: integer
      required:
      - marked_read
    Notification:
      type: object
      description: One notification as the frontend sees it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/NotificationKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        related_type:
          type: string
          readOnly: true
        related_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - kind
      - message
      - read_at
      - related_id
      - related_type
      - title
    NotificationKindEnum:
      enum:
      - post_awaiting_approval
      - post_published
      - post_failed
      - post_skipped
      - post_expired
      - account_needs_reauth
      - credential_invalid
      - quota_reached
      - plan_paused
      - outage_missed_slots
      type: string
      description: |-
        * `post_awaiting_approval` - A post is waiting for your approval
        * `post_published` - Post published
        * `post_failed` - A post could not be made
        * `post_skipped` - A post was skipped
        * `post_expired` - A post expired before it was approved
        * `account_needs_reauth` - Reconnect a social account
        * `credential_invalid` - An API key stopped working
        * `quota_reached` - You reached a free-tier limit
        * `plan_paused` - A content plan was paused
        * `outage_missed_slots` - Some scheduled posts were missed
    PatchedMeUpdate:
      type: object
      description: The details users may change about themselves.
      properties:
        timezone:
          type: string
          maxLength: 64
    Plan:
      type: object
      description: A plan as the API shows it, with its topics and accounts.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        requirements:
          type: string
          readOnly: true
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          readOnly: true
        ai_label_enabled:
          type: boolean
          readOnly: true
        ai_label_text:
          type: string
          readOnly: true
        paused:
          type: boolean
          readOnly: true
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
          readOnly: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SocialAccount'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accounts
      - ai_label_enabled
      - ai_label_text
      - approval_mode
      - created_at
      - id
      - name
      - paused
      - requirements
      - topics
    PlanCreate:
      type: object
      description: The details needed to create a plan.
      properties:
        name:
          type: string
          maxLength: 100
        requirements:
          type: string
          default: ''
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          default: manual
        ai_label_enabled:
          type: boolean
          default: true
        ai_label_text:
          type: string
          default: Made with AI assistance.
          maxLength: 100
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        account_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - account_ids
      - name
      - topics
    PlatformEnum:
      enum:
      - demo
      type: string
      description: '* `demo` - Demo network'
    Post:
      type: object
      description: 'A post in a list: its status and where it belongs.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: string
          format: uuid
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        topic_name:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/PostStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - demo_mode
      - id
      - plan
      - plan_name
      - status
      - status_reason
      - updated_at
    PostDetail:
      type: object
      description: One post with everything made for it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: string
          format: uuid
          readOnly: true
        plan_name:
          type: string
          readOnly: true
        topic_name:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/PostStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        article:
          allOf:
          - $ref: '#/components/schemas/ArticleSummary'
          readOnly: true
        poster_url:
          type: string
          nullable: true
          description: Return the address of the newest poster, or None if there is
            none.
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PostVersion'
          readOnly: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/GenerationStep'
          readOnly: true
        publications:
          type: array
          items:
            $ref: '#/components/schemas/Publication'
          readOnly: true
      required:
      - article
      - created_at
      - demo_mode
      - id
      - plan
      - plan_name
      - poster_url
      - publications
      - status
      - status_reason
      - steps
      - updated_at
      - versions
    PostStatusEnum:
      enum:
      - researching
      - drafting
      - imaging
      - reviewing
      - awaiting_approval
      - approved
      - publishing
      - published
      - rejected
      - skipped
      - failed
      type: string
      description: |-
        * `researching` - Finding an article
        * `drafting` - Writing the caption
        * `imaging` - Making the poster
        * `reviewing` - Checking the post
        * `awaiting_approval` - Waiting for your approval
        * `approved` - Approved
        * `publishing` - Publishing
        * `published` - Published
        * `rejected` - Rejected
        * `skipped` - Skipped
        * `failed` - Failed
    PostVersion:
      type: object
      description: One version of a post's words and poster.
      properties:
        number:
          type: integer
          readOnly: true
        headline:
          type: string
          readOnly: true
        caption:
          type: string
          readOnly: true
        image_prompt:
          type: string
          readOnly: true
        review:
          allOf:
          - $ref: '#/components/schemas/Review'
          readOnly: true
      required:
      - caption
      - headline
      - image_prompt
      - number
      - review
    PresetEnum:
      enum:
      - job_hiring
      - layoffs
      - linux_tips
      - ai_news
      type: string
      description: |-
        * `job_hiring` - Job hiring
        * `layoffs` - Layoffs
        * `linux_tips` - Linux tips
        * `ai_news` - AI news
    Publication:
      type: object
      description: Where a post was sent and what happened.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_name:
          type: string
          readOnly: true
        platform:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PublicationStatusEnum'
          readOnly: true
        external_id:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        demo_mode:
          type: boolean
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - account_name
      - demo_mode
      - error
      - external_id
      - id
      - platform
      - published_at
      - status
    PublicationStatusEnum:
      enum:
      - publishing
      - published
      - failed
      type: string
      description: |-
        * `publishing` - Publishing
        * `published` - Published
        * `failed` - Failed
    Recover:
      type: object
      description: The fields needed to reset a forgotten password with a recovery
        code.
      properties:
        email:
          type: string
          format: email
        recovery_code:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - email
      - new_password
      - recovery_code
    RecoverResult:
      type: object
      description: What a successful recovery sends back.
      properties:
        detail:
          type: string
        recovery_codes_left:
          type: integer
      required:
      - detail
      - recovery_codes_left
    RecoveryCodes:
      type: object
      description: A new set of recovery codes, shown once.
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - recovery_codes
    Register:
      type: object
      description: The fields needed to create an account.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        invite_code:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RegisterResult:
      type: object
      description: 'What registration sends back: the new user plus recovery codes.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
        tier:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - date_joined
      - email
      - id
      - recovery_codes
      - tier
      - timezone
    Review:
      type: object
      description: The AI review of a version and its verdict.
      properties:
        scores:
          readOnly: true
        issues:
          readOnly: true
        verdict:
          allOf:
          - $ref: '#/components/schemas/VerdictEnum'
          readOnly: true
      required:
      - issues
      - scores
      - verdict
    SocialAccount:
      type: object
      description: A linked social account, without its token.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        display_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SocialAccountStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_name
      - id
      - platform
      - status
    SocialAccountStatusEnum:
      enum:
      - active
      - needs_reauth
      - revoked
      type: string
      description: |-
        * `active` - Active
        * `needs_reauth` - Needs to be reconnected
        * `revoked` - Revoked
    Summary:
      type: object
      description: A small overview the frontend polls to show badges.
      properties:
        unread_notifications:
          type: integer
        posts_awaiting_approval:
          type: integer
        accounts_needing_attention:
          type: integer
      required:
      - accounts_needing_attention
      - posts_awaiting_approval
      - unread_notifications
    Topic:
      type: object
      description: One topic of a plan.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        preset:
          $ref: '#/components/schemas/PresetEnum'
      required:
      - id
      - name
      - preset
    UnreadCount:
      type: object
      description: How many notifications are unread.
      properties:
        unread:
          type: integer
      required:
      - unread
    Usage:
      type: object
      description: All of a user's limits.
      properties:
        tier:
          type: string
        limits:
          type: array
          items:
            $ref: '#/components/schemas/LimitUsage'
      required:
      - limits
      - tier
    User:
      type: object
      description: The details of a user that the API shows. Never includes the password.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        timezone:
          type: string
          readOnly: true
        tier:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - tier
      - timezone
    VerdictEnum:
      enum:
      - pass
      - revise
      - reject
      type: string
      description: |-
        * `pass` - Pass
        * `revise` - Needs changes
        * `reject` - Reject
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
