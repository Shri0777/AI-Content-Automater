      properties:
        email:
          type: string
          format: email
        recovery_code:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - email
      - new_password
      - recovery_code
    RecoverResult:
      type: object
      description: What a successful recovery sends back.
      properties:
        detail:
          type: string
        recovery_codes_left:
          type: integer
      required:
      - detail
      - recovery_codes_left
