name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/development.txt
    
    - name: Check migrations
      run: |
        python manage.py makemigrations --check --dry-run
      env:
        DJANGO_SETTINGS_MODULE: content_automater.settings.development
        SECRET_KEY: test-secret-key-for-ci
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
    
    - name: Compile Python files
      run: |
        python -m compileall -q frontend content research ai_providers users content_automater
    
    - name: Run tests
      run: |
        python manage.py test --keepdb --verbosity 2
      env:
        DJANGO_SETTINGS_MODULE: content_automater.settings.development
        SECRET_KEY: test-secret-key-for-ci
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
    
    - name: Django check
      run: |
        python manage.py check
      env:
        DJANGO_SETTINGS_MODULE: content_automater.settings.production
        SECRET_KEY: test-secret-key-for-ci
        ALLOWED_HOSTS: localhost
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t ai-content-automater:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run --rm ai-content-automater:${{ github.sha }} python --version
        docker run --rm ai-content-automater:${{ github.sha }} python manage.py check --deploy || true
