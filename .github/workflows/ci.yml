# Runs every check on each push and pull request. The commands are the same
# ones you run on your own computer (see docs/CODE-TOUR.md).
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    # The same database and Redis as docker-compose.yml, on the same ports,
    # so the default development settings work without changes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_content_automator
          POSTGRES_USER: automator
          POSTGRES_PASSWORD: automator-dev-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U automator -d ai_content_automator"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python and the exact package versions
        run: uv sync --locked

      # requirements.txt is generated from uv.lock for people who use pip.
      # This fails if someone changed one without regenerating the other.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code requirements.txt

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Beginner readability rules
        run: uv run python scripts/check_readability.py

      - name: Database migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: API description has no warnings
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml

      - name: Production settings pass Django's deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # CI-only values. They protect nothing real.
          DJANGO_SECRET_KEY: ci-only-not-secret-3f9a7c1e5b2d8a6f4c0e9b7d5a3f1c8e6b4d2a0f
          ENCRYPTION_KEY: 4kuHz3t5x4cXJ0G6Lq8V9pWmRbN2sYfT7aDcEgHiJkM=
          DJANGO_ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://app.example.com
          PUBLIC_API_URL: https://api.example.com
          FRONTEND_URL: https://app.example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest --cov --cov-fail-under=90

      - name: Security scan of our code (Bandit)
        run: uv run bandit -c pyproject.toml -r . -q

      - name: Known vulnerabilities in packages (pip-audit)
        run: uv run pip-audit

  # Unit tests run with development tools installed, which can hide a package
  # that production needs. This job builds the real image (production
  # packages only) and checks it can reach the database and the broker.
  production-image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ai_content_automator
          POSTGRES_USER: automator
          POSTGRES_PASSWORD: automator-dev-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U automator -d ai_content_automator"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t ai-content-automator .

      - name: Smoke check inside the image
        run: >-
          docker run --rm --network host
          -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5433
          -e CELERY_BROKER_URL=redis://localhost:6380/0
          ai-content-automator python scripts/smoke_check.py

  # The demo promise in the README: a clean checkout runs the whole product
  # with no API keys in three commands. This job runs exactly those commands
  # against the real web server, worker, database and Redis.
  demo-walkthrough:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the whole app
        run: docker compose up -d --build --wait

      - name: Run the demo walkthrough
        run: |
          code=$(docker compose exec -T web python manage.py create_invite_codes 1 | tail -n 1)
          python3 scripts/demo_walkthrough.py --invite-code "$code"

      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --tail=200

  # The frontend, then the whole product in a real browser. Type checks,
  # lint and a production build first; then Playwright (Firefox) drives
  # the public pages and a new user's journey, from sign-up to a published
  # post, against the same Docker Compose stack as the walkthrough above.
  # Any console error or warning fails the run. See client/README.md.
  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the whole app
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install the frontend's exact package versions
        working-directory: client
        run: npm ci

      - name: Type check, lint and production build
        working-directory: client
        run: npx tsc --noEmit && npm run lint && npm run build

      - name: Install Firefox for Playwright
        working-directory: client
        run: npx playwright install --with-deps firefox

      - name: Browser tests
        working-directory: client
        env:
          E2E_MANAGE: docker compose exec -T web python manage.py
        run: npm run test:e2e

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results

      - name: Show the app's logs if anything failed
        if: failure()
        run: docker compose logs --tail=200
