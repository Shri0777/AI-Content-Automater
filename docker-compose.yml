# Everything the project needs, run with Docker.
#
#   Only the database and Redis (when you run Django yourself with uv):
#       docker compose up -d db redis
#   The whole app (web server, worker and scheduler too):
#       docker compose up --build
#   The same, in the background, returning once the API is ready:
#       docker compose up -d --build --wait
#   Stop everything:
#       docker compose down
#
# Ports 5433 and 6380 are used on your computer so they never clash with a
# database or Redis you may already have installed.
# Settings shared by the web server, the workers and the scheduler. The
# ${NAME:-default} values can be set in a .env file next to this one (or in
# your shell); Docker Compose reads it when it starts the containers.
#   DEMO_MODE=false        real news; keep "true" to try it with no keys
#   PUBLIC_API_URL=...     how platforms (and Buffer) reach this API
x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.dev
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  DEMO_MODE: ${DEMO_MODE:-true}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Optional server-wide developer apps; users can save their own instead.
  X_CLIENT_ID: ${X_CLIENT_ID:-}
  X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_content_automator
      POSTGRES_USER: automator
      POSTGRES_PASSWORD: automator-dev-password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automator -d ai_content_automator"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API. It updates the database tables, then starts the web server.
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2"
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - media-files:/app/media
    # Healthy once the tables exist and the API answers, so
    # "docker compose up --wait" returns only when the app is ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs background jobs. It saves posters into the same media volume the
  # web server reads them from.
  worker:
    build: .
    command: celery -A config worker --loglevel=info --queues celery
    environment: *app-environment
    volumes:
      - media-files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Publishes posts and refreshes social tokens, on its own queue, so posts
  # go out on time even while many others are being made.
  worker-publish:
    build: .
    command: celery -A config worker --loglevel=info --queues publish --concurrency 2 --hostname publish@%h
    environment: *app-environment
    volumes:
      - media-files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Starts scheduled jobs at the right times (the timetable is in settings).
  beat:
    build: .
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  # Generated poster images, shared by the web server and the worker.
  media-files:
