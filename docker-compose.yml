# Everything the project needs, run with Docker.
#
#   Only the database and Redis (when you run Django yourself with uv):
#       docker compose up -d db redis
#   The whole app (web server, worker and scheduler too):
#       docker compose up --build
#   Stop everything:
#       docker compose down
#
# Ports 5433 and 6380 are used on your computer so they never clash with a
# database or Redis you may already have installed.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_content_automator
      POSTGRES_USER: automator
      POSTGRES_PASSWORD: automator-dev-password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automator -d ai_content_automator"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API. It updates the database tables, then starts the web server.
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs background jobs.
  worker:
    build: .
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Starts scheduled jobs at the right times (the timetable is in settings).
  beat:
    build: .
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
