services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_content_automater_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn content_automater.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=content_automater.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - TEXT_API_KEY=${TEXT_API_KEY}
      - TEXT_PROVIDER=${TEXT_PROVIDER:-auto}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-auto}
      - BUFFER_ACCESS_TOKEN=${BUFFER_ACCESS_TOKEN:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - SECURE_SSL_REDIRECT=false
      - SESSION_COOKIE_SECURE=false
      - CSRF_COOKIE_SECURE=false
      - DB_NAME=ai_content_automater_prod
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A content_automater worker -l info
    volumes:
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=content_automater.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - TEXT_API_KEY=${TEXT_API_KEY}
      - TEXT_PROVIDER=${TEXT_PROVIDER:-auto}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-auto}
      - BUFFER_ACCESS_TOKEN=${BUFFER_ACCESS_TOKEN:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - SECURE_SSL_REDIRECT=false
      - SESSION_COOKIE_SECURE=false
      - CSRF_COOKIE_SECURE=false
      - DB_NAME=ai_content_automater_prod
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A content_automater beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=content_automater.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - TEXT_API_KEY=${TEXT_API_KEY}
      - TEXT_PROVIDER=${TEXT_PROVIDER:-auto}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-auto}
      - BUFFER_ACCESS_TOKEN=${BUFFER_ACCESS_TOKEN:-}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - SECURE_SSL_REDIRECT=false
      - SESSION_COOKIE_SECURE=false
      - CSRF_COOKIE_SECURE=false
      - DB_NAME=ai_content_automater_prod
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
